<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4: Línea horizontal y citas</title>
    <style>
        hr {
            width: 80%;
            height: 5px;
            background-color: blue;
            border: none;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1>La importancia del conocimiento</h1>

    <p>El conocimiento nos permite aprender cosas nuevas y comprender mejor el mundo.</p>

    <hr>

    <blockquote>
        "Solo sé que no sé nada."
        <br>
        — Sócrates
    </blockquote>

    <p>Por eso, nunca debemos dejar de aprender y hacernos preguntas.</p>
</body>
